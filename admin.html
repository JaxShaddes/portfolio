<!DOCTYPE html>
<html lang="en" class="antialiased bg-[#f4f4f0] text-[#111]">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Editor — Bruno Clemente</title>
  <meta name="description" content="Local editor for portfolio data." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
          },
          colors: {
            'off-white': '#f4f4f0',
            'black': '#111111',
            'accent': 'var(--accent-color, #FF3300)',
            'gray-light': '#e5e5e5',
          },
        }
      }
    }
  </script>

  <style>
    :root { --accent-color: #4b5670; }
    body { overflow-x: hidden; }

    .grid-overlay {
      background-size: 100px 100px;
      background-image:
        linear-gradient(to right, rgba(0, 0, 0, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.05) 1px, transparent 1px);
      pointer-events: none;
    }

    .field {
      outline: none;
      transition: box-shadow .2s, border-color .2s, transform .2s;
    }
    .field:focus {
      border-color: rgba(17,17,17,.9);
      box-shadow: 0 0 0 4px rgba(75,86,112,.15);
    }
  </style>
</head>

<body class="min-h-screen">
  <div class="fixed inset-0 grid-overlay opacity-40 pointer-events-none"></div>

  <nav class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-6 py-6 mix-blend-difference text-[#f4f4f0]">
    <div class="font-display font-bold text-xl tracking-tighter uppercase">Portfolio Editor</div>
    <div class="flex items-center gap-3">
      <div class="flex border border-black/20 bg-white/20 rounded-full overflow-hidden">
        <button id="langEn" class="px-3 py-2 text-xs uppercase tracking-widest">EN</button>
        <button id="langPt" class="px-3 py-2 text-xs uppercase tracking-widest">PT</button>
      </div>
      <button id="setFolder" class="px-4 py-2 border border-black text-xs uppercase tracking-widest">Set Folder</button>
      <button id="saveFile" class="px-4 py-2 bg-black text-[#f4f4f0] text-xs uppercase tracking-widest">Save data.js</button>
      <button id="downloadFile" class="px-4 py-2 border border-black text-xs uppercase tracking-widest">Download</button>
    </div>
  </nav>

  <main class="relative pt-28 px-6 pb-20">
    <div class="max-w-screen-2xl mx-auto flex items-center justify-between mb-6">
      <div class="flex border border-black/20 bg-white/70 rounded-full overflow-hidden">
        <button id="tabEditor" class="px-4 py-2 text-xs uppercase tracking-widest">Editor</button>
        <button id="tabPreview" class="px-4 py-2 text-xs uppercase tracking-widest">Preview</button>
      </div>
      <div id="previewState" class="text-xs uppercase tracking-widest opacity-60 hidden">Preview needs refresh</div>
    </div>

    <div id="editorView" class="max-w-screen-2xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-10">
      <aside class="lg:col-span-4">
        <div class="border border-black/10 bg-white/50 backdrop-blur-sm rounded-2xl p-6 shadow-sm">
          <div class="flex items-center justify-between">
            <h2 class="font-display font-bold uppercase text-xl">Projects</h2>
            <button id="addProject" class="text-xs uppercase tracking-widest border border-black px-3 py-2 rounded-full">Add</button>
          </div>
          <div class="mt-4">
            <input id="projectSearch" type="text" placeholder="Search by title, client, or slug" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm" />
          </div>
          <div id="projectList" class="mt-4 space-y-2"></div>
        </div>

        <div class="border border-black/10 bg-white/50 backdrop-blur-sm rounded-2xl p-6 shadow-sm mt-6">
          <h2 class="font-display font-bold uppercase text-xl mb-4">Clients</h2>
          <p class="text-xs uppercase tracking-widest opacity-60 mb-2">One per line</p>
          <div class="flex justify-end mb-2">
            <button id="syncClients" class="text-xs uppercase tracking-widest border border-black px-3 py-2 rounded-full">Sync From Projects</button>
          </div>
          <textarea id="clientsInput" rows="8" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm"></textarea>
        </div>

        <div class="mt-6 text-xs uppercase tracking-widest opacity-60" id="statusLine">No changes</div>
      </aside>

      <section class="lg:col-span-8">
        <div class="border border-black/10 bg-white/50 backdrop-blur-sm rounded-2xl p-6 shadow-sm">
          <div class="flex items-center justify-between gap-3 mb-6">
            <h2 class="font-display font-bold uppercase text-xl">Project Details</h2>
            <div class="flex items-center gap-2 flex-wrap justify-end">
              <button id="duplicateProject" class="text-xs uppercase tracking-widest border border-black px-3 py-2 rounded-full">Duplicate</button>
              <button id="moveProjectUp" class="text-xs uppercase tracking-widest border border-black px-3 py-2 rounded-full">Move Up</button>
              <button id="moveProjectDown" class="text-xs uppercase tracking-widest border border-black px-3 py-2 rounded-full">Move Down</button>
              <button id="deleteProject" class="text-xs uppercase tracking-widest border border-black px-3 py-2 rounded-full">Delete</button>
            </div>
          </div>

          <div id="emptyState" class="text-sm opacity-70">Select a project to edit.</div>

          <div id="projectForm" class="space-y-6 hidden">
            <div id="projectFieldErrors" class="hidden rounded-xl border border-red-300 bg-red-50 p-4 text-sm text-red-700"></div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Slug</label>
                <input id="fieldSlug" type="text" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm" />
                <div id="slugHint" class="mt-2 text-[11px] font-mono uppercase tracking-wider opacity-60">URL: #/project/</div>
              </div>
              <div>
                <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Year</label>
                <input id="fieldYear" type="text" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm" />
              </div>
              <div>
                <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Month (1-12)</label>
                <input id="fieldMonth" type="number" min="1" max="12" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm" />
              </div>
              <div class="flex items-end">
                <label class="inline-flex items-center gap-2 text-xs uppercase tracking-widest opacity-70">
                  <input id="fieldShowMonth" type="checkbox" class="accent-black" />
                  Show Month
                </label>
              </div>
              <div class="flex items-end">
                <label class="inline-flex items-center gap-2 text-xs uppercase tracking-widest opacity-70">
                  <input id="fieldFeatured" type="checkbox" class="accent-black" />
                  Featured On Home
                </label>
              </div>
              <div>
                <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Title (Lang)</label>
                <input id="fieldTitle" type="text" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm" />
              </div>
              <div>
                <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Client (Lang)</label>
                <input id="fieldClient" type="text" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm" />
              </div>
              <div class="md:col-span-2">
                <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Cover Image</label>
                <input id="fieldCover" type="text" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm" />
              </div>
              <div class="md:col-span-2">
                <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Tags (one per line)</label>
                <textarea id="fieldTags" rows="3" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm"></textarea>
              </div>
              <div class="md:col-span-2">
                <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Services (Lang, one per line)</label>
                <textarea id="fieldServices" rows="3" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm"></textarea>
              </div>
              <div class="md:col-span-2">
                <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Role (Lang, one per line)</label>
                <textarea id="fieldRole" rows="3" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm"></textarea>
              </div>
              <div class="md:col-span-2">
                <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Description (Lang, one paragraph per line)</label>
                <textarea id="fieldDescription" rows="6" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm"></textarea>
              </div>
              <div class="md:col-span-2">
                <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Images (one per line)</label>
                <textarea id="fieldImages" rows="6" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm"></textarea>
              </div>
              <div class="md:col-span-2">
                <div class="flex items-center justify-between mb-2">
                  <label class="block text-xs uppercase tracking-widest opacity-70">Media Preview</label>
                  <button id="refreshPreview" type="button" class="text-xs uppercase tracking-widest border border-black px-3 py-2 rounded-full">Refresh</button>
                </div>
                <div id="mediaPreview" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="border border-black/10 bg-white/50 backdrop-blur-sm rounded-2xl p-6 shadow-sm mt-6">
          <div class="flex items-center justify-between mb-6">
            <h2 class="font-display font-bold uppercase text-xl">Site Settings</h2>
            <button id="validateData" class="text-xs uppercase tracking-widest border border-black px-3 py-2 rounded-full">Validate Data</button>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="lg:col-span-2 space-y-4">
              <div class="flex items-center justify-between">
                <h3 class="font-display uppercase tracking-tight text-lg">Copy (Form)</h3>
                <span class="text-[10px] uppercase tracking-widest opacity-60">Editing: <span id="copyFormLangLabel">EN</span></span>
              </div>

              <details class="border border-black/10 rounded-xl bg-white/60 p-4" open>
                <summary class="cursor-pointer text-xs uppercase tracking-widest opacity-70">Home</summary>
                <div class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Hero Line 1</label>
                    <input id="copyHomeHero1" type="text" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm" />
                  </div>
                  <div>
                    <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Hero Line 2</label>
                    <input id="copyHomeHero2" type="text" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm" />
                  </div>
                  <div>
                    <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Hero Line 3</label>
                    <input id="copyHomeHero3" type="text" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm" />
                  </div>
                  <div>
                    <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Hero Line 4</label>
                    <input id="copyHomeHero4" type="text" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm" />
                  </div>
                  <div class="md:col-span-2">
                    <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Hero Body</label>
                    <textarea id="copyHomeHeroBody" rows="3" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm"></textarea>
                  </div>
                  <div>
                    <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Marquee</label>
                    <input id="copyHomeMarquee" type="text" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm" />
                  </div>
                  <div>
                    <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Selected Work</label>
                    <input id="copyHomeSelectedWork" type="text" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm" />
                  </div>
                  <div>
                    <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">View All</label>
                    <input id="copyHomeViewAll" type="text" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm" />
                  </div>
                  <div>
                    <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Approach Title</label>
                    <input id="copyHomeApproachTitle" type="text" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm" />
                  </div>
                  <div class="md:col-span-2">
                    <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Approach Body</label>
                    <textarea id="copyHomeApproachBody" rows="4" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm"></textarea>
                  </div>
                  <div class="md:col-span-2">
                    <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Approach List (one per line)</label>
                    <textarea id="copyHomeApproachList" rows="4" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm"></textarea>
                  </div>
                </div>
              </details>

              <details class="border border-black/10 rounded-xl bg-white/60 p-4">
                <summary class="cursor-pointer text-xs uppercase tracking-widest opacity-70">About</summary>
                <div class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Title Line 1</label>
                    <input id="copyAboutTitle1" type="text" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm" />
                  </div>
                  <div>
                    <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Title Line 2</label>
                    <input id="copyAboutTitle2" type="text" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm" />
                  </div>
                  <div>
                    <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Title Line 3</label>
                    <input id="copyAboutTitle3" type="text" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm" />
                  </div>
                  <div>
                    <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Clients Title</label>
                    <input id="copyAboutClientsTitle" type="text" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm" />
                  </div>
                  <div class="md:col-span-2">
                    <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Body 1</label>
                    <textarea id="copyAboutBody1" rows="4" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm"></textarea>
                  </div>
                  <div class="md:col-span-2">
                    <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Body 2</label>
                    <textarea id="copyAboutBody2" rows="4" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm"></textarea>
                  </div>
                </div>
              </details>

              <details class="border border-black/10 rounded-xl bg-white/60 p-4">
                <summary class="cursor-pointer text-xs uppercase tracking-widest opacity-70">Contact</summary>
                <div class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Title Line 1</label>
                    <input id="copyContactTitle1" type="text" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm" />
                  </div>
                  <div>
                    <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Title Line 2</label>
                    <input id="copyContactTitle2" type="text" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm" />
                  </div>
                  <div>
                    <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Title Line 3</label>
                    <input id="copyContactTitle3" type="text" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm" />
                  </div>
                  <div>
                    <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Subtitle</label>
                    <textarea id="copyContactSubtitle" rows="3" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm"></textarea>
                  </div>
                  <div>
                    <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Form Name Label</label>
                    <input id="copyContactFormNameLabel" type="text" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm" />
                  </div>
                  <div>
                    <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Form Email Label</label>
                    <input id="copyContactFormEmailLabel" type="text" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm" />
                  </div>
                  <div>
                    <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Form Project Label</label>
                    <input id="copyContactFormProjectLabel" type="text" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm" />
                  </div>
                  <div>
                    <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Name Placeholder</label>
                    <input id="copyContactFormNamePlaceholder" type="text" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm" />
                  </div>
                  <div>
                    <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Email Placeholder</label>
                    <input id="copyContactFormEmailPlaceholder" type="text" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm" />
                  </div>
                  <div>
                    <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Message Placeholder</label>
                    <input id="copyContactFormMessagePlaceholder" type="text" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm" />
                  </div>
                  <div>
                    <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Send</label>
                    <input id="copyContactFormSend" type="text" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm" />
                  </div>
                  <div>
                    <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Sending</label>
                    <input id="copyContactFormSending" type="text" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm" />
                  </div>
                  <div>
                    <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Success Title</label>
                    <input id="copyContactFormSuccessTitle" type="text" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm" />
                  </div>
                  <div class="md:col-span-2">
                    <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Success Body</label>
                    <textarea id="copyContactFormSuccessBody" rows="3" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm"></textarea>
                  </div>
                  <div>
                    <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Send Another</label>
                    <input id="copyContactFormSendAnother" type="text" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm" />
                  </div>
                  <div>
                    <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Error</label>
                    <input id="copyContactFormError" type="text" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm" />
                  </div>
                </div>
              </details>

              <details class="border border-black/10 rounded-xl bg-white/60 p-4">
                <summary class="cursor-pointer text-xs uppercase tracking-widest opacity-70">Nav + Footer</summary>
                <div class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Nav Home</label>
                    <input id="copyNavHome" type="text" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm" />
                  </div>
                  <div>
                    <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Nav Work</label>
                    <input id="copyNavWork" type="text" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm" />
                  </div>
                  <div>
                    <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Nav About</label>
                    <input id="copyNavAbout" type="text" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm" />
                  </div>
                  <div>
                    <label class="block text-xs uppercase tracking-widest opacity-70 mb-2">Nav Contact</label>
                    <input id="copyNavContact" type="text" class="field w-full px-4 py-3 rounded-xl border border-black/10 bg-[#f4f4f0] text-black font-sans text-sm" />
                  </div>
                  <div>

  <script>
    (function () {
      const data = window.PORTFOLIO_DATA ? JSON.parse(JSON.stringify(window.PORTFOLIO_DATA)) : null;
      const el = (id) => document.getElementById(id);

      const state = {
        lang: "en",
        selectedSlug: null,
        dirty: false,
        projectSearch: "",
        activeTab: "editor",
        previewStale: false,
        previewReady: false,
      };

      const listEl = el("projectList");
      const statusEl = el("statusLine");
      const formEl = el("projectForm");
      const emptyEl = el("emptyState");
      const folderBtn = el("setFolder");
      const projectSearchInput = el("projectSearch");
      const projectFieldErrorsEl = el("projectFieldErrors");
      const mediaPreviewEl = el("mediaPreview");
      const slugHintEl = el("slugHint");
