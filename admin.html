      const refreshPreviewBtn = el("refreshPreview");
      const duplicateProjectBtn = el("duplicateProject");
      const moveProjectUpBtn = el("moveProjectUp");
      const moveProjectDownBtn = el("moveProjectDown");
      const deleteProjectBtn = el("deleteProject");
      const tabEditorBtn = el("tabEditor");
      const tabPreviewBtn = el("tabPreview");
      const editorViewEl = el("editorView");
      const previewViewEl = el("previewView");
      const previewStateEl = el("previewState");
      const previewRouteInput = el("previewRoute");
      const refreshSitePreviewBtn = el("refreshSitePreview");
      const openSitePreviewBtn = el("openSitePreview");
      const sitePreviewFrame = el("sitePreviewFrame");

      let directoryHandle = null;
      const PREVIEW_STORAGE_KEY = "bc_portfolio_preview_data_v1";
      const DRAFT_STORAGE_KEY = "bc_portfolio_editor_draft_v1";
      const DRAFT_VERSION = 1;
      let draftSaveTimer = null;

      const inputs = {
        slug: el("fieldSlug"),
        year: el("fieldYear"),
        month: el("fieldMonth"),
        showMonth: el("fieldShowMonth"),
        featured: el("fieldFeatured"),
        title: el("fieldTitle"),
        client: el("fieldClient"),
        cover: el("fieldCover"),
        tags: el("fieldTags"),
        services: el("fieldServices"),
        role: el("fieldRole"),
        description: el("fieldDescription"),
        images: el("fieldImages"),
      };

      const settings = {
        copy: el("copyInput"),
        copyError: el("copyError"),
        copyLangLabel: el("copyLangLabel"),
        copyFormLangLabel: el("copyFormLangLabel"),
        filters: el("filtersInput"),
        filtersError: el("filtersError"),
        monthsEn: el("monthsEnInput"),
        monthsPt: el("monthsPtInput"),
        monthsError: el("monthsError"),
        validateBtn: el("validateData"),
        validateOutput: el("validateOutput"),
      };

      if (!data) {
        statusEl.textContent = "data.js not found.";
        return;
      }

      const ensureDataShape = () => {
        data.projects = data.projects || { en: [], pt: [] };
        data.projects.en = data.projects.en || [];
        data.projects.pt = data.projects.pt || [];
        data.clients = data.clients || [];
        data.copy = data.copy || {};
        data.copy.en = data.copy.en || {};
        data.copy.pt = data.copy.pt || {};
        data.filters = data.filters || [];
        data.monthsShort = data.monthsShort || {
          en: ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"],
          pt: ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"],
        };
        data.monthsShort.en = data.monthsShort.en || ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        data.monthsShort.pt = data.monthsShort.pt || ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
      };

      ensureDataShape();

      const createProjectBase = (slug = "") => ({
        slug,
        title: "",
        year: "",
        month: null,
        showMonth: false,
        featured: false,
        client: "",
        services: [],
        role: "",
        tags: [],
        coverImage: "",
        description: [],
        images: [],
      });

      const normalizeSlug = (value) => {
        return String(value || "")
          .normalize("NFKD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "")
          .replace(/-{2,}/g, "-");
      };

      const slugPattern = /^[a-z0-9]+(?:-[a-z0-9]+)*$/;
      const isSlugValid = (slug) => slugPattern.test(slug);

      const normalizeProject = (project, fallbackSlug = "") => {
        const base = createProjectBase(fallbackSlug);
        const next = { ...base, ...(project || {}) };
        next.slug = normalizeSlug(next.slug || fallbackSlug);
        next.tags = Array.isArray(next.tags) ? next.tags : [];
        next.services = Array.isArray(next.services) ? next.services : [];
        next.description = Array.isArray(next.description)
          ? next.description
          : (next.description ? [String(next.description)] : []);
        next.images = Array.isArray(next.images) ? next.images : [];
        next.role = Array.isArray(next.role)
          ? next.role.filter((item) => String(item || "").trim())
          : String(next.role || "").trim();
        next.month = Number.isFinite(Number(next.month)) ? Number(next.month) : null;
        next.showMonth = !!next.showMonth;
        next.featured = !!next.featured;
        return next;
      };

      const normalizeProjectCollection = () => {
        ["en", "pt"].forEach((lang) => {
          data.projects[lang] = (data.projects[lang] || []).map((project) => normalizeProject(project, project && project.slug));
        });
      };

      normalizeProjectCollection();

      const normalizeEditorLang = (lang) => (lang === "pt" ? "pt" : "en");
      const formatSavedAt = (ts) => {
        try {
          return new Date(ts).toLocaleString();
        } catch {
          return "unknown time";
        }
      };

      const clearDraftSnapshot = () => {
        try {
          localStorage.removeItem(DRAFT_STORAGE_KEY);
        } catch {
          // ignore
        }
      };

      const writeDraftSnapshot = () => {
        if (!state.dirty) return;
        try {
          const payload = {
            version: DRAFT_VERSION,
            savedAt: Date.now(),
            data,
            ui: {
              lang: state.lang,
              selectedSlug: state.selectedSlug,
              projectSearch: state.projectSearch,
              previewRoute: previewRouteInput ? previewRouteInput.value : "#/",
            },
          };
          localStorage.setItem(DRAFT_STORAGE_KEY, JSON.stringify(payload));
        } catch {
          // ignore draft save failures
        }
      };

      const scheduleDraftSave = () => {
        if (draftSaveTimer) clearTimeout(draftSaveTimer);
        draftSaveTimer = setTimeout(() => {
          draftSaveTimer = null;
          writeDraftSnapshot();
        }, 250);
      };

      const readDraftSnapshot = () => {
        try {
          const raw = localStorage.getItem(DRAFT_STORAGE_KEY);
          if (!raw) return null;
          const parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== "object") return null;
          if (!parsed.data || typeof parsed.data !== "object") return null;
          return parsed;
        } catch {
          return null;
        }
      };

      const applyDraftSnapshot = (snapshot) => {
        const draftData = snapshot && snapshot.data;
        if (!draftData || typeof draftData !== "object") return false;

        Object.keys(data).forEach((key) => delete data[key]);
        Object.assign(data, JSON.parse(JSON.stringify(draftData)));
        ensureDataShape();
        normalizeProjectCollection();

        const ui = snapshot && snapshot.ui;
        if (ui && typeof ui === "object") {
          state.lang = normalizeEditorLang(ui.lang);
          state.selectedSlug = typeof ui.selectedSlug === "string" ? ui.selectedSlug : state.selectedSlug;
          state.projectSearch = typeof ui.projectSearch === "string" ? ui.projectSearch : "";
          if (previewRouteInput && typeof ui.previewRoute === "string") {
            previewRouteInput.value = ui.previewRoute;
          }
        }
        return true;
      };

      const restoreDraftIfAvailable = () => {
        const snapshot = readDraftSnapshot();
        if (!snapshot) return null;

        const savedAtLabel = formatSavedAt(snapshot.savedAt);
        const shouldRestore = confirm(`Unsaved draft found from ${savedAtLabel}. Restore it now?`);
        if (!shouldRestore) {
          clearDraftSnapshot();
          return null;
        }

        const applied = applyDraftSnapshot(snapshot);
        if (!applied) {
          clearDraftSnapshot();
          return null;
        }

        return snapshot.savedAt || Date.now();
      };

      const parseList = (value) => value.split("\n").map((s) => s.trim()).filter(Boolean);
      const formatList = (arr) => (arr || []).join("\n");

      const setFieldError = (el, msg) => {
        if (!el) return;
        if (!msg) {
          el.textContent = "";
          el.classList.add("hidden");
          return;
        }
        el.textContent = msg;
        el.classList.remove("hidden");
      };

      const formatFilters = (filters) => {
        return (filters || [])
          .map((f) => `${f.value || ""} | ${(f.label && f.label.en) || ""} | ${(f.label && f.label.pt) || ""}`.trim())
          .join("\n");
      };

      const parseFiltersText = (text) => {
        const lines = text.split("\n").map((l) => l.trim()).filter(Boolean);
        const items = [];
        const invalid = [];
        lines.forEach((line, idx) => {
          const parts = line.split("|").map((p) => p.trim());
          if (!parts[0]) {
            invalid.push(idx + 1);
            return;
          }
          if (parts.length < 3) invalid.push(idx + 1);
          items.push({
            value: parts[0],
            label: { en: parts[1] || "", pt: parts[2] || "" },
          });
        });
        return { items, invalid };
      };

      const renderCopyEditor = () => {
        if (!settings.copy) return;
        const copyObj = data.copy[state.lang] || {};
        settings.copy.value = JSON.stringify(copyObj, null, 2);
        if (settings.copyLangLabel) settings.copyLangLabel.textContent = state.lang.toUpperCase();
        if (settings.copyFormLangLabel) settings.copyFormLangLabel.textContent = state.lang.toUpperCase();
        setFieldError(settings.copyError, "");
      };

      const renderFiltersEditor = () => {
        if (!settings.filters) return;
        settings.filters.value = formatFilters(data.filters);
        setFieldError(settings.filtersError, "");
      };

      const renderMonthsEditor = () => {
        if (settings.monthsEn) settings.monthsEn.value = formatList(data.monthsShort.en || []);
        if (settings.monthsPt) settings.monthsPt.value = formatList(data.monthsShort.pt || []);
        setFieldError(settings.monthsError, "");
      };

      const getCopyLang = () => {
        data.copy = data.copy || {};
        data.copy[state.lang] = data.copy[state.lang] || {};
        return data.copy[state.lang];
      };

      const getCopyValue = (obj, path) => {
        let cur = obj;
        for (let i = 0; i < path.length; i += 1) {
          const key = path[i];
          if (cur == null) return "";
          if (typeof key === "number") {
            if (!Array.isArray(cur)) return "";
            cur = cur[key];
          } else {
            cur = cur[key];
          }
        }
        return cur;
      };

      const setCopyValue = (obj, path, value) => {
        let cur = obj;
        for (let i = 0; i < path.length - 1; i += 1) {
          const key = path[i];
          const nextKey = path[i + 1];
          const shouldBeArray = typeof nextKey === "number";
          if (typeof key === "number") {
            if (!Array.isArray(cur)) return;
            if (cur[key] == null || typeof cur[key] !== "object") {
              cur[key] = shouldBeArray ? [] : {};
            }
            cur = cur[key];
          } else {
            if (cur[key] == null || typeof cur[key] !== "object") {
              cur[key] = shouldBeArray ? [] : {};
            }
            cur = cur[key];
          }
        }
        const last = path[path.length - 1];
        if (typeof last === "number") {
          if (!Array.isArray(cur)) return;
          cur[last] = value;
          return;
        }
        cur[last] = value;
      };

      const copyFields = [
        { id: "copyMetaTitle", path: ["meta", "title"] },
        { id: "copyMetaDescription", path: ["meta", "description"] },
        { id: "copyNavHome", path: ["nav", "home"] },
        { id: "copyNavWork", path: ["nav", "work"] },
        { id: "copyNavAbout", path: ["nav", "about"] },
        { id: "copyNavContact", path: ["nav", "contact"] },
        { id: "copyNavClientPortal", path: ["nav", "clientPortal"] },
        { id: "copyHomeHero1", path: ["home", "heroLines", 0] },
        { id: "copyHomeHero2", path: ["home", "heroLines", 1] },
        { id: "copyHomeHero3", path: ["home", "heroLines", 2] },
        { id: "copyHomeHero4", path: ["home", "heroLines", 3] },
        { id: "copyHomeHeroBody", path: ["home", "heroBody"] },
        { id: "copyHomeMarquee", path: ["home", "marquee"] },
        { id: "copyHomeSelectedWork", path: ["home", "selectedWork"] },
        { id: "copyHomeViewAll", path: ["home", "viewAll"] },
        { id: "copyHomeApproachTitle", path: ["home", "approachTitle"] },
        { id: "copyHomeApproachBody", path: ["home", "approachBody"] },
        { id: "copyHomeApproachList", path: ["home", "approachList"], type: "list" },
        { id: "copyWorkTitle", path: ["work", "title"] },
        { id: "copyWorkViewCaseStudy", path: ["work", "viewCaseStudy"] },
        { id: "copyProjectClient", path: ["project", "client"] },
        { id: "copyProjectDate", path: ["project", "date"] },
        { id: "copyProjectServices", path: ["project", "services"] },
        { id: "copyProjectRole", path: ["project", "role"] },
        { id: "copyProjectOverview", path: ["project", "overview"] },
        { id: "copyProjectReadMore", path: ["project", "readMore"] },
        { id: "copyProjectReadLess", path: ["project", "readLess"] },
        { id: "copyProjectBackToWork", path: ["project", "backToWork"] },
        { id: "copyProjectNotFound", path: ["project", "notFound"] },
        { id: "copyProjectDefaultRole", path: ["project", "defaultRole"] },
        { id: "copyAboutTitle1", path: ["about", "titleLines", 0] },
        { id: "copyAboutTitle2", path: ["about", "titleLines", 1] },
        { id: "copyAboutTitle3", path: ["about", "titleLines", 2] },
        { id: "copyAboutBody1", path: ["about", "body1"] },
        { id: "copyAboutBody2", path: ["about", "body2"] },
        { id: "copyAboutClientsTitle", path: ["about", "clientsTitle"] },
        { id: "copyContactTitle1", path: ["contact", "titleLines", 0] },
        { id: "copyContactTitle2", path: ["contact", "titleLines", 1] },
        { id: "copyContactTitle3", path: ["contact", "titleLines", 2] },
        { id: "copyContactSubtitle", path: ["contact", "subtitle"] },
        { id: "copyContactFormNameLabel", path: ["contact", "form", "nameLabel"] },
        { id: "copyContactFormEmailLabel", path: ["contact", "form", "emailLabel"] },
        { id: "copyContactFormProjectLabel", path: ["contact", "form", "projectLabel"] },
        { id: "copyContactFormNamePlaceholder", path: ["contact", "form", "namePlaceholder"] },
        { id: "copyContactFormEmailPlaceholder", path: ["contact", "form", "emailPlaceholder"] },
        { id: "copyContactFormMessagePlaceholder", path: ["contact", "form", "messagePlaceholder"] },
        { id: "copyContactFormSend", path: ["contact", "form", "send"] },
        { id: "copyContactFormSending", path: ["contact", "form", "sending"] },
        { id: "copyContactFormSuccessTitle", path: ["contact", "form", "successTitle"] },
        { id: "copyContactFormSuccessBody", path: ["contact", "form", "successBody"] },
        { id: "copyContactFormSendAnother", path: ["contact", "form", "sendAnother"] },
        { id: "copyContactFormError", path: ["contact", "form", "error"] },
        { id: "copyFooterTagline", path: ["footer", "tagline"] },
        { id: "copyFooterSitemap", path: ["footer", "sitemap"] },
        { id: "copyFooterSocial", path: ["footer", "social"] },
        { id: "copyFooterConnect", path: ["footer", "connect"] },
        { id: "copyFooterLetsTalk", path: ["footer", "letsTalk"] },
        { id: "copyFooterRights", path: ["footer", "rights"] },
        { id: "copyFooterLocation", path: ["footer", "location"] },
      ];

      const syncCopyJson = () => {
        if (!settings.copy) return;
        const copyLang = getCopyLang();
        settings.copy.value = JSON.stringify(copyLang, null, 2);
        setFieldError(settings.copyError, "");
        if (settings.copyLangLabel) settings.copyLangLabel.textContent = state.lang.toUpperCase();
      };

      const renderCopyForm = () => {
        const copyLang = getCopyLang();
        copyFields.forEach((field) => {
          const input = el(field.id);
          if (!input) return;
          const value = getCopyValue(copyLang, field.path);
          if (field.type === "list") {
            input.value = formatList(Array.isArray(value) ? value : []);
          } else {
            input.value = value != null ? String(value) : "";
          }
        });
        if (settings.copyFormLangLabel) settings.copyFormLangLabel.textContent = state.lang.toUpperCase();
      };

      const normalizePreviewRoute = (value) => {
        const raw = String(value || "").trim();
        if (!raw) return "#/";
        if (raw.startsWith("#")) return raw;
        if (raw.startsWith("/")) return `#${raw}`;
        return `#/${raw}`;
      };

      const setPreviewStale = (flag) => {
        state.previewStale = !!flag;
        if (!previewStateEl) return;
        const show = state.previewReady && state.previewStale && state.activeTab === "editor";
        previewStateEl.classList.toggle("hidden", !show);
      };

      const updateTabButtons = () => {
        if (tabEditorBtn) {
          tabEditorBtn.classList.toggle("bg-black", state.activeTab === "editor");
          tabEditorBtn.classList.toggle("text-[#f4f4f0]", state.activeTab === "editor");
        }
        if (tabPreviewBtn) {
          tabPreviewBtn.classList.toggle("bg-black", state.activeTab === "preview");
          tabPreviewBtn.classList.toggle("text-[#f4f4f0]", state.activeTab === "preview");
        }
      };

      const writePreviewData = () => {
        try {
          localStorage.setItem(PREVIEW_STORAGE_KEY, JSON.stringify(data));
          return true;
        } catch {
          setDirty(state.dirty, "Preview unavailable: localStorage blocked.");
          return false;
        }
      };

      const getPreviewUrl = (cacheBust = true) => {
        const route = normalizePreviewRoute(previewRouteInput ? previewRouteInput.value : "#/");
        if (previewRouteInput) previewRouteInput.value = route;
        const stamp = cacheBust ? `&ts=${Date.now()}` : "";
        return `./index.html?adminPreview=1${stamp}${route}`;
      };

      const refreshSitePreview = () => {
        if (!sitePreviewFrame) return;
        if (!writePreviewData()) return;
        sitePreviewFrame.src = getPreviewUrl(true);
        state.previewReady = true;
        setPreviewStale(false);
      };

      const openSitePreview = () => {
        if (!writePreviewData()) return;
        window.open(getPreviewUrl(true), "_blank");
        state.previewReady = true;
        setPreviewStale(false);
      };

      const setActiveTab = (tab) => {
        state.activeTab = tab === "preview" ? "preview" : "editor";
        if (editorViewEl) editorViewEl.classList.toggle("hidden", state.activeTab !== "editor");
        if (previewViewEl) previewViewEl.classList.toggle("hidden", state.activeTab !== "preview");
        updateTabButtons();
        if (previewStateEl) {
          const show = state.previewReady && state.previewStale && state.activeTab === "editor";
          previewStateEl.classList.toggle("hidden", !show);
        }
        if (state.activeTab === "preview" && (!sitePreviewFrame || !sitePreviewFrame.src || state.previewStale)) {
          refreshSitePreview();
        }
      };

      const setDirty = (flag = true, message = "") => {
        state.dirty = flag;
        if (flag) {
          setPreviewStale(true);
          scheduleDraftSave();
        } else {
          if (draftSaveTimer) {
            clearTimeout(draftSaveTimer);
            draftSaveTimer = null;
          }
          clearDraftSnapshot();
        }
        if (message) {
          statusEl.textContent = message;
          return;
        }
        statusEl.textContent = state.dirty ? "Unsaved changes" : "No changes";
      };

      const slugExists = (slug) => {
        return [...data.projects.en, ...data.projects.pt].some((p) => p.slug === slug);
      };

      const ensureProject = (lang, slug) => {
        let p = data.projects[lang].find((item) => item.slug === slug);
        if (!p) {
          p = createProjectBase(slug);
          data.projects[lang].push(p);
        } else {
          p = Object.assign(p, normalizeProject(p, slug));
        }
        return p;
      };

      const getProject = (lang, slug) => data.projects[lang].find((item) => item.slug === slug);
      const getProjectIndex = (lang, slug) => data.projects[lang].findIndex((item) => item.slug === slug);
      const getProjectBase = (slug) => getProject("en", slug) || getProject("pt", slug) || null;

      const setButtonDisabled = (button, disabled) => {
        if (!button) return;
        button.disabled = !!disabled;
        button.classList.toggle("opacity-40", !!disabled);
        button.classList.toggle("cursor-not-allowed", !!disabled);
      };

      const updateProjectActionButtons = () => {
        const list = data.projects[state.lang] || [];
        const idx = state.selectedSlug ? list.findIndex((p) => p.slug === state.selectedSlug) : -1;
        const noSelection = idx < 0;
        setButtonDisabled(duplicateProjectBtn, noSelection);
        setButtonDisabled(deleteProjectBtn, noSelection);
        setButtonDisabled(moveProjectUpBtn, noSelection || idx === 0);
        setButtonDisabled(moveProjectDownBtn, noSelection || idx === list.length - 1);
      };

      const renderSlugHint = (slug) => {
        if (!slugHintEl) return;
        slugHintEl.textContent = `URL: #/project/${encodeURIComponent(slug || "")}`;
      };

      const collectProjectFieldIssues = (slug, lang) => {
        const issues = [];
        if (!slug) {
          issues.push("Missing project slug.");
          return issues;
        }
        const pBase = getProjectBase(slug);
        const pLang = getProject(lang, slug);
        if (!pBase || !pLang) {
          issues.push("Missing language entry for this project.");
          return issues;
        }
        if (!isSlugValid(pBase.slug)) {
          issues.push("Slug should contain only lowercase letters, numbers, and hyphens.");
        }
        if (!pBase.year || !String(pBase.year).trim()) {
          issues.push("Year is required.");
        }
        if (!pBase.coverImage || !String(pBase.coverImage).trim()) {
          issues.push("Cover image path is required.");
        }
        if (!Array.isArray(pBase.images) || pBase.images.length === 0) {
          issues.push("At least one gallery image is required.");
        }
        if (!pLang.title || !String(pLang.title).trim()) {
          issues.push(`Title is required for ${lang.toUpperCase()}.`);
        }
        if (!pLang.client || !String(pLang.client).trim()) {
          issues.push(`Client is required for ${lang.toUpperCase()}.`);
        }
        if (!Array.isArray(pLang.services) || pLang.services.length === 0) {
          issues.push(`At least one service is required for ${lang.toUpperCase()}.`);
        }
        const descOk = Array.isArray(pLang.description)
          ? pLang.description.length > 0
          : !!String(pLang.description || "").trim();
        if (!descOk) {
          issues.push(`Description is required for ${lang.toUpperCase()}.`);
        }
        return issues;
      };

      const renderProjectFieldIssues = () => {
        if (!projectFieldErrorsEl) return;
        if (!state.selectedSlug) {
          projectFieldErrorsEl.innerHTML = "";
          projectFieldErrorsEl.classList.add("hidden");
          return;
        }
        const issues = collectProjectFieldIssues(state.selectedSlug, state.lang);
        if (issues.length === 0) {
          projectFieldErrorsEl.innerHTML = "";
          projectFieldErrorsEl.classList.add("hidden");
          return;
        }
        projectFieldErrorsEl.innerHTML = "";
        const title = document.createElement("div");
        title.className = "font-mono uppercase tracking-widest text-[11px] mb-2";
        title.textContent = `Project Checklist (${issues.length})`;
        projectFieldErrorsEl.appendChild(title);
        issues.forEach((msg) => {
          const row = document.createElement("div");
          row.textContent = `- ${msg}`;
          projectFieldErrorsEl.appendChild(row);
        });
        projectFieldErrorsEl.classList.remove("hidden");
      };

      const renderMediaPreview = () => {
        if (!mediaPreviewEl) return;
        mediaPreviewEl.innerHTML = "";
        if (!state.selectedSlug) return;
        const pBase = getProjectBase(state.selectedSlug);
        if (!pBase) return;
        const items = [];
        if (pBase.coverImage) items.push({ label: "Cover", path: pBase.coverImage });
        if (Array.isArray(pBase.images)) {
          pBase.images.forEach((path, idx) => {
            if (path) items.push({ label: `Image ${idx + 1}`, path });
          });
        }
        if (items.length === 0) {
          const empty = document.createElement("div");
          empty.className = "text-sm opacity-70";
          empty.textContent = "No media paths yet.";
          mediaPreviewEl.appendChild(empty);
          return;
        }
        items.forEach((item) => {
          const card = document.createElement("div");
          card.className = "border border-black/10 rounded-xl bg-white/60 overflow-hidden";
          const img = document.createElement("img");
          img.src = item.path;
          img.alt = "";
          img.loading = "lazy";
          img.className = "w-full h-36 object-cover bg-black/5";
          const label = document.createElement("div");
          label.className = "px-3 py-2";
          const top = document.createElement("div");
          top.className = "text-[10px] uppercase tracking-widest opacity-60";
          top.textContent = item.label;
          const path = document.createElement("div");
          path.className = "font-mono text-[11px] break-all";
          path.textContent = item.path;
          label.appendChild(top);
          label.appendChild(path);
          img.addEventListener("error", () => {
            img.classList.add("opacity-40");
            top.textContent = `${item.label} (broken)`;
          });
          card.appendChild(img);
          card.appendChild(label);
          mediaPreviewEl.appendChild(card);
        });
      };

      const reorderProject = (slug, direction) => {
        const move = (list) => {
          const idx = list.findIndex((p) => p.slug === slug);
          if (idx < 0) return false;
          const target = idx + direction;
          if (target < 0 || target >= list.length) return false;
          const [project] = list.splice(idx, 1);
          list.splice(target, 0, project);
          return true;
        };
        const movedEn = move(data.projects.en);
        const movedPt = move(data.projects.pt);
        return movedEn || movedPt;
      };

      const updateLangButtons = () => {
        const enBtn = el("langEn");
        const ptBtn = el("langPt");
        if (!enBtn || !ptBtn) return;
        enBtn.classList.toggle("bg-black", state.lang === "en");
        enBtn.classList.toggle("text-[#f4f4f0]", state.lang === "en");
        ptBtn.classList.toggle("bg-black", state.lang === "pt");
        ptBtn.classList.toggle("text-[#f4f4f0]", state.lang === "pt");
        renderCopyEditor();
        renderCopyForm();
      };

      const renderProjectList = () => {
        if (!listEl) return;
        listEl.innerHTML = "";
        const projects = data.projects[state.lang] || [];
        const query = (state.projectSearch || "").trim().toLowerCase();
        const filteredProjects = projects.filter((p) => {
          if (!query) return true;
          const title = String(p.title || "").toLowerCase();
          const client = String(p.client || "").toLowerCase();
          const slug = String(p.slug || "").toLowerCase();
          return title.includes(query) || client.includes(query) || slug.includes(query);
        });
        if (projects.length === 0) {
          const empty = document.createElement("div");
          empty.className = "text-sm opacity-70";
          empty.textContent = "No projects yet.";
          listEl.appendChild(empty);
          updateProjectActionButtons();
          return;
        }
        if (filteredProjects.length === 0) {
          const empty = document.createElement("div");
          empty.className = "text-sm opacity-70";
          empty.textContent = "No matching projects.";
          listEl.appendChild(empty);
          updateProjectActionButtons();
          return;
        }
        filteredProjects.forEach((p) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "w-full text-left px-4 py-3 rounded-xl border border-black/10 bg-white/60 hover:bg-white transition-colors";
          if (p.slug === state.selectedSlug) {
            btn.className += " bg-black text-[#f4f4f0] border-black";
          }
          const title = p.title || p.slug || "Untitled";
          const issues = collectProjectFieldIssues(p.slug, state.lang);
          const featureBadge = p.featured ? " | featured" : "";
          const qualityBadge = issues.length > 0 ? ` | ${issues.length} issue${issues.length === 1 ? "" : "s"}` : "";
          btn.innerHTML = `<div class="font-display uppercase tracking-tight">${title}</div><div class="text-xs uppercase tracking-widest opacity-60 mt-1">${p.year || ""}${featureBadge}${qualityBadge}</div>`;
          btn.addEventListener("click", () => {
            state.selectedSlug = p.slug;
            renderForm();
            renderProjectList();
          });
          listEl.appendChild(btn);
        });
        updateProjectActionButtons();
      };

      const renderForm = () => {
        if (!state.selectedSlug) {
          formEl.classList.add("hidden");
          emptyEl.classList.remove("hidden");
          renderProjectFieldIssues();
          renderMediaPreview();
          updateProjectActionButtons();
          return;
        }
        const pLang = getProject(state.lang, state.selectedSlug);
        if (!pLang) {
          formEl.classList.add("hidden");
          emptyEl.classList.remove("hidden");
          renderProjectFieldIssues();
          renderMediaPreview();
          updateProjectActionButtons();
          return;
        }
        const pBase = getProject("en", state.selectedSlug) || getProject("pt", state.selectedSlug) || pLang;

        formEl.classList.remove("hidden");
        emptyEl.classList.add("hidden");

        inputs.slug.value = pBase.slug || "";
        inputs.year.value = pBase.year || "";
        inputs.month.value = pBase.month ? String(pBase.month) : "";
        inputs.showMonth.checked = !!pBase.showMonth;
        inputs.featured.checked = !!pBase.featured;
        inputs.title.value = pLang.title || "";
        inputs.client.value = pLang.client || "";
        inputs.cover.value = pBase.coverImage || "";
        inputs.tags.value = formatList(pBase.tags);
        inputs.services.value = formatList(pLang.services);
        inputs.role.value = formatList(Array.isArray(pLang.role) ? pLang.role : (pLang.role ? [pLang.role] : []));
        inputs.description.value = formatList(pLang.description);
        inputs.images.value = formatList(pBase.images);
        renderSlugHint(pBase.slug || "");
        renderProjectFieldIssues();
        renderMediaPreview();
        updateProjectActionButtons();
      };

      const renderSiteSettings = () => {
        renderCopyEditor();
        renderCopyForm();
        renderFiltersEditor();
        renderMonthsEditor();
      };

      const updateField = (field, value, scope) => {
        if (!state.selectedSlug) return;
        if (scope === "both") {
          const pEn = ensureProject("en", state.selectedSlug);
          const pPt = ensureProject("pt", state.selectedSlug);
          pEn[field] = value;
          pPt[field] = value;
        } else {
          const pLang = ensureProject(state.lang, state.selectedSlug);
          pLang[field] = value;
        }
        setDirty();
        renderProjectFieldIssues();
        if (field === "coverImage" || field === "images") {
          renderMediaPreview();
        }
        if (field === "featured") {
          renderProjectList();
        }
      };

      inputs.year.addEventListener("input", (e) => updateField("year", e.target.value, "both"));
      inputs.month.addEventListener("input", (e) => {
        const val = e.target.value.trim();
        const num = val ? parseInt(val, 10) : null;
        updateField("month", Number.isFinite(num) ? num : null, "both");
      });
      inputs.showMonth.addEventListener("change", (e) => updateField("showMonth", !!e.target.checked, "both"));
      inputs.featured.addEventListener("change", (e) => updateField("featured", !!e.target.checked, "both"));
      inputs.title.addEventListener("input", (e) => updateField("title", e.target.value, "lang"));
      inputs.client.addEventListener("input", (e) => updateField("client", e.target.value, "lang"));
      inputs.cover.addEventListener("input", (e) => updateField("coverImage", e.target.value, "both"));
      inputs.tags.addEventListener("input", (e) => updateField("tags", parseList(e.target.value), "both"));
      inputs.services.addEventListener("input", (e) => updateField("services", parseList(e.target.value), "lang"));
      inputs.role.addEventListener("input", (e) => {
        const list = parseList(e.target.value);
        updateField("role", list.length > 1 ? list : (list[0] || ""), "lang");
      });
      inputs.description.addEventListener("input", (e) => updateField("description", parseList(e.target.value), "lang"));
      inputs.images.addEventListener("input", (e) => updateField("images", parseList(e.target.value), "both"));
      if (refreshPreviewBtn) refreshPreviewBtn.addEventListener("click", renderMediaPreview);

      inputs.slug.addEventListener("change", (e) => {
        const next = normalizeSlug(e.target.value.trim());
        if (!next) {
          e.target.value = state.selectedSlug || "";
          return;
        }
        if (!isSlugValid(next)) {
          alert("Invalid slug. Use lowercase letters, numbers and hyphens.");
          e.target.value = state.selectedSlug || "";
          return;
        }
        if (next !== state.selectedSlug && slugExists(next)) {
          alert("Slug already exists.");
          e.target.value = state.selectedSlug || "";
          return;
        }
        const old = state.selectedSlug;
        ["en", "pt"].forEach((lang) => {
          const p = getProject(lang, old);
          if (p) p.slug = next;
        });
        state.selectedSlug = next;
        e.target.value = next;
        setDirty();
        renderSlugHint(next);
        renderProjectFieldIssues();
        renderProjectList();
      });

      el("addProject").addEventListener("click", () => {
        const title = prompt("New project title");
        if (!title) return;
        const suggestedSlug = normalizeSlug(title);
        const slug = prompt("New project slug (unique)", suggestedSlug);
        if (!slug) return;
        const clean = normalizeSlug(slug.trim());
        if (!clean) return;
        if (!isSlugValid(clean)) {
          alert("Invalid slug. Use lowercase letters, numbers and hyphens.");
          return;
        }
        if (slugExists(clean)) {
          alert("Slug already exists.");
          return;
        }
        const base = createProjectBase(clean);
        base.title = title.trim();
        data.projects.en.push({ ...base });
        data.projects.pt.push({ ...base });
        state.selectedSlug = clean;
        setDirty();
        renderProjectList();
        renderForm();
      });

      if (duplicateProjectBtn) {
        duplicateProjectBtn.addEventListener("click", () => {
          if (!state.selectedSlug) return;
          const sourceEn = getProject("en", state.selectedSlug);
          const sourcePt = getProject("pt", state.selectedSlug);
          const fallbackSlug = `${state.selectedSlug}-copy`;
          const raw = prompt("Duplicate project slug", fallbackSlug);
          if (!raw) return;
          const nextSlug = normalizeSlug(raw);
          if (!nextSlug) return;
          if (!isSlugValid(nextSlug)) {
            alert("Invalid slug. Use lowercase letters, numbers and hyphens.");
            return;
          }
          if (slugExists(nextSlug)) {
            alert("Slug already exists.");
            return;
          }

          const cloneEn = normalizeProject(JSON.parse(JSON.stringify(sourceEn || createProjectBase(nextSlug))), nextSlug);
          const clonePt = normalizeProject(JSON.parse(JSON.stringify(sourcePt || createProjectBase(nextSlug))), nextSlug);
          cloneEn.slug = nextSlug;
          clonePt.slug = nextSlug;
          cloneEn.featured = false;
          clonePt.featured = false;

          const idxEn = getProjectIndex("en", state.selectedSlug);
          const idxPt = getProjectIndex("pt", state.selectedSlug);
          if (idxEn >= 0) data.projects.en.splice(idxEn + 1, 0, cloneEn);
          else data.projects.en.push(cloneEn);
          if (idxPt >= 0) data.projects.pt.splice(idxPt + 1, 0, clonePt);
          else data.projects.pt.push(clonePt);

          state.selectedSlug = nextSlug;
          setDirty();
          renderProjectList();
          renderForm();
        });
      }

      if (moveProjectUpBtn) {
        moveProjectUpBtn.addEventListener("click", () => {
          if (!state.selectedSlug) return;
          if (reorderProject(state.selectedSlug, -1)) {
            setDirty();
            renderProjectList();
            renderForm();
          }
        });
      }

      if (moveProjectDownBtn) {
        moveProjectDownBtn.addEventListener("click", () => {
          if (!state.selectedSlug) return;
          if (reorderProject(state.selectedSlug, 1)) {
            setDirty();
            renderProjectList();
            renderForm();
          }
        });
      }

      if (deleteProjectBtn) deleteProjectBtn.addEventListener("click", () => {
        if (!state.selectedSlug) return;
        if (!confirm("Delete this project?")) return;
        data.projects.en = data.projects.en.filter((p) => p.slug !== state.selectedSlug);
        data.projects.pt = data.projects.pt.filter((p) => p.slug !== state.selectedSlug);
        state.selectedSlug = data.projects[state.lang][0] ? data.projects[state.lang][0].slug : null;
        setDirty();
        renderProjectList();
        renderForm();
      });

      const clientsInput = el("clientsInput");
      clientsInput.value = formatList(data.clients);
      clientsInput.addEventListener("input", () => {
        data.clients = parseList(clientsInput.value);
        setDirty();
      });
      if (syncClientsBtn) {
        syncClientsBtn.addEventListener("click", () => {
          const merged = new Set(data.clients);
          data.projects.en.forEach((project) => {
            const client = String((project && project.client) || "").trim();
            if (client) merged.add(client);
          });
          data.clients = [...merged];
          clientsInput.value = formatList(data.clients);
          setDirty(true, "Clients list synced from EN projects.");
        });
      }

      if (projectSearchInput) {
        projectSearchInput.addEventListener("input", (e) => {
          state.projectSearch = String(e.target.value || "");
          renderProjectList();
        });
      }

      if (tabEditorBtn) {
        tabEditorBtn.addEventListener("click", () => setActiveTab("editor"));
      }
      if (tabPreviewBtn) {
        tabPreviewBtn.addEventListener("click", () => setActiveTab("preview"));
      }
      if (refreshSitePreviewBtn) {
        refreshSitePreviewBtn.addEventListener("click", refreshSitePreview);
      }
      if (openSitePreviewBtn) {
        openSitePreviewBtn.addEventListener("click", openSitePreview);
      }
      if (previewRouteInput) {
        previewRouteInput.addEventListener("change", () => {
          previewRouteInput.value = normalizePreviewRoute(previewRouteInput.value);
          setPreviewStale(true);
          if (state.activeTab === "preview") refreshSitePreview();
        });
        previewRouteInput.addEventListener("keydown", (event) => {
          if (event.key !== "Enter") return;
          event.preventDefault();
          previewRouteInput.value = normalizePreviewRoute(previewRouteInput.value);
          setPreviewStale(true);
          if (state.activeTab === "preview") refreshSitePreview();
        });
      }

      let copyParseTimer = null;
      if (settings.copy) {
        settings.copy.addEventListener("input", () => {
          if (copyParseTimer) clearTimeout(copyParseTimer);
          copyParseTimer = setTimeout(() => {
            try {
              const obj = JSON.parse(settings.copy.value || "{}");
              data.copy[state.lang] = obj;
              setDirty();
              setFieldError(settings.copyError, "");
              renderCopyForm();
            } catch (err) {
              setFieldError(settings.copyError, "Invalid JSON");
            }
          }, 300);
        });
      }

      copyFields.forEach((field) => {
        const input = el(field.id);
        if (!input) return;
        input.addEventListener("input", () => {
          const value = field.type === "list" ? parseList(input.value) : input.value;
          const copyLang = getCopyLang();
          setCopyValue(copyLang, field.path, value);
          setDirty();
          syncCopyJson();
        });
      });

      if (settings.filters) {
        settings.filters.addEventListener("input", () => {
          const { items, invalid } = parseFiltersText(settings.filters.value || "");
          data.filters = items;
          setDirty();
          if (invalid.length > 0) {
            setFieldError(settings.filtersError, `Check line(s): ${invalid.join(", ")}`);
          } else {
            setFieldError(settings.filtersError, "");
          }
        });
      }

      const updateMonths = () => {
        if (settings.monthsEn) data.monthsShort.en = parseList(settings.monthsEn.value || "");
        if (settings.monthsPt) data.monthsShort.pt = parseList(settings.monthsPt.value || "");
        setDirty();
        const enCount = data.monthsShort.en.length;
        const ptCount = data.monthsShort.pt.length;
        if (enCount !== 12 || ptCount !== 12) {
          setFieldError(settings.monthsError, `Expected 12 months per language. EN=${enCount}, PT=${ptCount}.`);
        } else {
          setFieldError(settings.monthsError, "");
        }
      };
      if (settings.monthsEn) settings.monthsEn.addEventListener("input", updateMonths);
      if (settings.monthsPt) settings.monthsPt.addEventListener("input", updateMonths);

      const buildDataJs = () => `window.PORTFOLIO_DATA = ${JSON.stringify(data, null, 2)};\n`;

      const supportsDirectoryPicker = () => typeof window.showDirectoryPicker === "function";

      const idbRequest = (req) => new Promise((resolve, reject) => {
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });

      const openDB = () => new Promise((resolve, reject) => {
        const req = indexedDB.open("portfolio_editor", 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains("handles")) {
            db.createObjectStore("handles");
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });

      const idbGet = async (key) => {
        const db = await openDB();
        const tx = db.transaction("handles", "readonly");
        const store = tx.objectStore("handles");
        const req = store.get(key);
        const value = await idbRequest(req);
        await new Promise((resolve, reject) => {
          tx.oncomplete = resolve;
          tx.onerror = reject;
          tx.onabort = reject;
        });
        return value;
      };

      const idbSet = async (key, value) => {
        const db = await openDB();
        const tx = db.transaction("handles", "readwrite");
        const store = tx.objectStore("handles");
        store.put(value, key);
        await new Promise((resolve, reject) => {
          tx.oncomplete = resolve;
          tx.onerror = reject;
          tx.onabort = reject;
        });
      };

      const loadDirectoryHandle = async () => {
        if (!supportsDirectoryPicker()) return;
        try {
          const handle = await idbGet("saveDir");
          if (handle) {
            directoryHandle = handle;
            setDirty(state.dirty, "Save folder restored.");
          }
        } catch {
          // ignore
        }
      };

      const ensureDirPermission = async () => {
        if (!directoryHandle) return false;
        const perm = await directoryHandle.queryPermission({ mode: "readwrite" });
        if (perm === "granted") return true;
        const req = await directoryHandle.requestPermission({ mode: "readwrite" });
        return req === "granted";
      };

      const saveToDirectory = async (content) => {
        if (!directoryHandle) return false;
        const ok = await ensureDirPermission();
        if (!ok) return false;
        const fileHandle = await directoryHandle.getFileHandle("data.js", { create: true });
        const writable = await fileHandle.createWritable();
        await writable.write(content);
        await writable.close();
        return true;
      };

      const isEmpty = (val) => {
        if (val === null || val === undefined) return true;
        if (Array.isArray(val)) return val.length === 0;
        if (typeof val === "string") return val.trim() === "";
        return false;
      };

      const resolvePath = (path) => {
        try {
          return new URL(path, window.location.href).href;
        } catch {
          return null;
        }
      };

      const checkImage = (url) => {
        return new Promise((resolve) => {
          const img = new Image();
          let done = false;
          const finish = (ok) => {
            if (done) return;
            done = true;
            resolve(ok);
          };
          const timer = setTimeout(() => finish(false), 4000);
          img.onload = () => {
            clearTimeout(timer);
            finish(true);
          };
          img.onerror = () => {
            clearTimeout(timer);
            finish(false);
          };
          img.src = url;
        });
      };

      const renderValidationOutput = (issues) => {
        if (!settings.validateOutput) return;
        settings.validateOutput.innerHTML = "";
        if (issues.length === 0) {
          const ok = document.createElement("div");
          ok.className = "text-sm text-green-700";
          ok.textContent = "No issues found.";
          settings.validateOutput.appendChild(ok);
          return;
        }
        const head = document.createElement("div");
        head.className = "text-sm font-mono uppercase tracking-widest opacity-70 mb-2";
        head.textContent = `Issues (${issues.length})`;
        settings.validateOutput.appendChild(head);
        issues.forEach((msg) => {
          const row = document.createElement("div");
          row.className = "text-sm text-red-700";
          row.textContent = msg;
          settings.validateOutput.appendChild(row);
        });
      };

      const collectValidationIssues = async () => {
        const issues = [];
        const add = (msg) => issues.push(msg);

        const checkDupes = (list, lang) => {
          const seen = new Set();
          list.forEach((p) => {
            if (!p.slug) return;
            if (seen.has(p.slug)) add(`[${lang}] Duplicate slug: ${p.slug}`);
            else seen.add(p.slug);
          });
        };

        const checkProject = (p, lang) => {
          const name = p.slug || "(missing slug)";
          if (isEmpty(p.slug)) add(`[${lang}] Project missing slug`);
          if (!isEmpty(p.slug) && !isSlugValid(p.slug)) add(`[${lang}] ${name} has invalid slug format`);
          if (isEmpty(p.title)) add(`[${lang}] ${name} missing title`);
          if (isEmpty(p.client)) add(`[${lang}] ${name} missing client`);
          if (!Array.isArray(p.services) || p.services.length === 0) add(`[${lang}] ${name} missing services`);
          if (isEmpty(p.year)) add(`[${lang}] ${name} missing year`);
          if (isEmpty(p.coverImage)) add(`[${lang}] ${name} missing cover image`);
          if (!Array.isArray(p.images) || p.images.length === 0) add(`[${lang}] ${name} missing images`);
          const descEmpty = Array.isArray(p.description)
            ? p.description.length === 0
            : isEmpty(p.description);
          if (descEmpty) add(`[${lang}] ${name} missing description`);
        };

        checkDupes(data.projects.en, "en");
        checkDupes(data.projects.pt, "pt");

        const enSet = new Set(data.projects.en.map((p) => p.slug).filter(Boolean));
        const ptSet = new Set(data.projects.pt.map((p) => p.slug).filter(Boolean));
        enSet.forEach((slug) => {
          if (!ptSet.has(slug)) add(`Missing PT entry for slug: ${slug}`);
        });
        ptSet.forEach((slug) => {
          if (!enSet.has(slug)) add(`Missing EN entry for slug: ${slug}`);
        });

        data.projects.en.forEach((p) => checkProject(p, "en"));
        data.projects.pt.forEach((p) => checkProject(p, "pt"));

        data.filters.forEach((f, idx) => {
          if (!f.value) add(`Filter ${idx + 1} missing value`);
          if (!f.label || isEmpty(f.label.en) || isEmpty(f.label.pt)) add(`Filter ${f.value || idx + 1} missing labels`);
        });

        if (!data.monthsShort || !Array.isArray(data.monthsShort.en) || data.monthsShort.en.length !== 12) {
          add("Months EN should have 12 items.");
        }
        if (!data.monthsShort || !Array.isArray(data.monthsShort.pt) || data.monthsShort.pt.length !== 12) {
          add("Months PT should have 12 items.");
        }

        const imagePaths = new Set();
        const collectImages = (p) => {
          if (typeof p.coverImage === "string" && p.coverImage.trim()) imagePaths.add(p.coverImage.trim());
          if (Array.isArray(p.images)) {
            p.images.forEach((img) => {
              if (typeof img === "string" && img.trim()) imagePaths.add(img.trim());
            });
          }
        };
        data.projects.en.forEach(collectImages);
        data.projects.pt.forEach(collectImages);

        const broken = [];
        for (const path of imagePaths) {
          if (/^https?:\/\//i.test(path)) continue;
          const url = resolvePath(path);
          if (!url) {
            broken.push(path);
            continue;
          }
          const ok = await checkImage(url);
          if (!ok) broken.push(path);
        }
        broken.forEach((p) => add(`Broken image path: ${p}`));

        return issues;
      };

      const validateData = async () => {
        if (!settings.validateBtn) return [];
        settings.validateBtn.disabled = true;
        settings.validateBtn.textContent = "Validating...";
        if (settings.validateOutput) settings.validateOutput.textContent = "Validating...";
        const issues = await collectValidationIssues();
        renderValidationOutput(issues);
        settings.validateBtn.disabled = false;
        settings.validateBtn.textContent = "Validate Data";
        return issues;
      };

      el("downloadFile").addEventListener("click", () => {
        const content = buildDataJs();
        const blob = new Blob([content], { type: "text/javascript" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "data.js";
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        setDirty(state.dirty, "Downloaded data.js");
      });

      el("saveFile").addEventListener("click", async () => {
        const issues = await validateData();
        if (issues.length > 0) {
          setDirty(state.dirty, `Cannot save: fix ${issues.length} validation issue${issues.length === 1 ? "" : "s"}.`);
          return;
        }
        const content = buildDataJs();
        if (directoryHandle) {
          try {
            const saved = await saveToDirectory(content);
            if (saved) {
              setDirty(false, "Saved to selected folder.");
              return;
            }
          } catch (err) {
            // fall through to picker
          }
        }
        if (!window.showSaveFilePicker) {
          setDirty(state.dirty, "Save not supported. Use Download.");
          return;
        }
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: "data.js",
            types: [{ description: "JavaScript", accept: { "text/javascript": [".js"] } }],
          });
          const writable = await handle.createWritable();
          await writable.write(content);
          await writable.close();
          setDirty(false, "Saved to data.js");
        } catch (err) {
          setDirty(state.dirty, "Save canceled.");
        }
      });

      if (folderBtn) {
        if (!supportsDirectoryPicker()) {
          folderBtn.disabled = true;
          folderBtn.classList.add("opacity-50", "cursor-not-allowed");
          folderBtn.title = "Not supported in this browser";
        } else {
          folderBtn.addEventListener("click", async () => {
            try {
              const handle = await window.showDirectoryPicker();
              if (!handle) return;
              directoryHandle = handle;
              await idbSet("saveDir", handle);
              setDirty(state.dirty, "Save folder set.");
            } catch (err) {
              setDirty(state.dirty, "Folder selection canceled.");
            }
          });
        }
      }

      if (settings.validateBtn) {
        settings.validateBtn.addEventListener("click", validateData);
      }

      window.addEventListener("beforeunload", (event) => {
        if (!state.dirty) return;
        writeDraftSnapshot();
        event.preventDefault();
        event.returnValue = "";
      });

      el("langEn").addEventListener("click", () => {
        state.lang = "en";
        updateLangButtons();
        renderProjectList();
        renderForm();
      });
      el("langPt").addEventListener("click", () => {
        state.lang = "pt";
        updateLangButtons();
        renderProjectList();
        renderForm();
      });

      const restoredDraftAt = restoreDraftIfAvailable();
      if (projectSearchInput) projectSearchInput.value = state.projectSearch || "";
      if (previewRouteInput) {
        previewRouteInput.value = normalizePreviewRoute(previewRouteInput.value);
      }
      if (!state.selectedSlug || !slugExists(state.selectedSlug)) {
        state.selectedSlug = (data.projects.en[0] && data.projects.en[0].slug) || (data.projects.pt[0] && data.projects.pt[0].slug) || null;
      }
      setActiveTab("editor");
      updateLangButtons();
      renderProjectList();
      renderForm();
      renderSiteSettings();
      updateProjectActionButtons();
      loadDirectoryHandle();
      if (restoredDraftAt) {
        setDirty(true, `Draft restored from ${formatSavedAt(restoredDraftAt)}.`);
      } else {
        setDirty(false);
      }
    })();
  </script>
</body>
</html>
